[project]
name = "oggy-reels-bot"
version = "0.1.0"
description = "Automated Instagram Reels bot for Oggy cartoon content"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "you@example.com"}
]
dependencies = [
    # Core
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    
    # Database
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    
    # Redis / Queue
    "redis>=5.0",
    "apscheduler>=3.10",
    
    # HTTP / API
    "httpx>=0.27",
    "tenacity>=8.3",
    
    # YouTube
    "google-api-python-client>=2.12",
    "yt-dlp>=2024.7",
    
    # Video Processing
    "moviepy>=1.0",
    "opencv-python-headless>=4.10",
    "scenedetect>=0.6",
    
    # LLM
    "openai>=1.30",
    "anthropic>=0.34",
    
    # Storage
    "boto3>=1.34",
    "botocore>=1.34",
    
    # Instagram
    "instagrapi>=2.0",  # Fallback for private API if needed
    
    # Utilities
    "structlog>=24.1",
    "rich>=13.7",
    "tqdm>=4.66",
    "python-dateutil>=2.9",
    "croniter>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "ipython>=8.25",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "W", "C90", "ANN", "ARG", "B", "C4", "DTZ", "T20", "PTH", "ERA", "PL", "TRY", "SIM", "PER", "RUF"]
ignore = ["ANN101", "ANN102", "ARG001", "ARG002", "TRY003", "PTH118"]
src = ["src", "scripts", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.alembic]
script_location = "src/migrations"