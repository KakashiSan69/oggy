version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: oggy_bot_test
      POSTGRES_USER: oggy
      POSTGRES_PASSWORD: testpass
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oggy"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  test:
    build:
      context: .
      target: development
    environment:
      - APP_ENV=testing
      - LOG_LEVEL=DEBUG
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=oggy_bot_test
      - DB_USER=oggy
      - DB_PASSWORD=testpass
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - YOUTUBE_API_KEY=test_key
      - YOUTUBE_CHANNEL_IDS=UC123
      - IG_APP_ID=test
      - IG_APP_SECRET=test
      - IG_ACCESS_TOKEN=test
      - IG_USER_ID=test
      - IG_PAGE_ID=test
      - LLM_API_KEY=test
      - LLM_PROVIDER=ollama
      - LLM_BASE_URL=http://host.docker.internal:11434/v1
      - STORAGE_ENDPOINT=https://test.r2.cloudflarestorage.com
      - STORAGE_ACCESS_KEY=test
      - STORAGE_SECRET_KEY=test
      - STORAGE_BUCKET=test
      - STORAGE_PUBLIC_URL=https://pub.test.r2.dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: pytest -v --tb=short
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro